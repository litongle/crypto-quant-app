# 生产编排 — 1Panel / VPS 拉镜像部署
# 镜像由 GitHub Actions push 到 docker.io/tongle6/crypto-quant-backend
# (见 .github/workflows/release.yml — main 分支每次 push 自动 build)
#
# === 1Panel 编排步骤 ===
#   1. 1Panel → 容器 → 编排 → 添加编排
#      把本文件全部内容粘进去
#   2. 同编排目录创建 .env 文件,粘 .env.production.example 模板,填:
#      - SECRET_KEY=$(openssl rand -hex 32)
#      - JWT_SECRET_KEY=$(openssl rand -hex 32)
#      - POSTGRES_PASSWORD=  (自己生强密码)
#      - REDIS_PASSWORD=     (自己生强密码)
#      - ADMIN_USERNAME=     (邮箱)
#      - ADMIN_PASSWORD_HASH= (下面第 4 步生成)
#      - CORS_ORIGINS=https://你的域名
#   3. 启动编排 → backend 容器会自动跑 alembic upgrade head 建表
#   4. 生成 admin hash 粘回 .env 后重启 backend:
#      docker compose -f docker-compose.prod.yml run --rm backend \
#          python -m scripts.generate_admin_hash
#   5. 1Panel → 网站 → 反向代理:
#      你的域名 → http://127.0.0.1:8000
#      自定义 header:
#        proxy_set_header X-Forwarded-Proto https;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header Host $host;
#      申请 Let's Encrypt 证书 → 强制 HTTPS
#
# === 关键配置说明 ===
#   - backend 8000 绑 127.0.0.1: 公网必须经 1Panel OpenResty/Nginx 反代,不能直连
#   - postgres / redis 完全不 publish 端口: 走 docker 内网 service name,公网无路径触达
#   - DATABASE_URL / REDIS_URL 从密码拼: 你只在 .env 改一处密码,两处自动同步
#   - 升级镜像: 1Panel 编排页面点"重新拉取镜像" 或 `docker compose pull && up -d`

services:
  backend:
    image: tongle6/crypto-quant-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      # 单点密码 — 改 .env 里的 POSTGRES_PASSWORD/REDIS_PASSWORD,这两个 URL 自动跟着变
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 里设置}@postgres:5432/crypto_quant
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 里设置}@redis:6379/0
      - ENVIRONMENT=production
    # lifespan 里的 init_db() 已经处理建表/迁移(fresh DB stamp head, existing DB upgrade),
    # 这里不再前置 alembic upgrade head — SQLite 上 0005 PG-comment migration 会报错。
    # --proxy-headers 让 8000 信任反代头(1Panel OpenResty 注入 X-Forwarded-Proto)
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 里设置}
      - POSTGRES_DB=crypto_quant
    # 不 publish 端口 — backend 通过 docker 内网 service name 访问
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 里设置}
    # 不 publish 端口 — backend 通过 docker 内网 service name 访问
    volumes:
      - redis_data:/data
    command: sh -c 'redis-server --appendonly yes --save 60 1000 --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  postgres_data:
  redis_data:
  backend_data:
