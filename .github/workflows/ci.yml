name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crypto_quant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/crypto_quant_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret-key
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run core and service tests
        run: |
          pytest -q --tb=short \
            tests/test_config.py \
            tests/test_error_handling.py \
            tests/test_exchange_adapters.py \
            tests/test_market_service_perp.py \
            tests/test_order_service.py \
            tests/test_performance.py \
            tests/test_repositories.py \
            tests/test_rsi_layered.py \
            tests/test_rule_engine.py \
            tests/test_security.py \
            tests/test_seed_data.py \
            tests/test_startup.py \
            tests/test_strategy.py \
            tests/test_strategy_intent_dispatch.py \
            tests/test_strategy_runner.py \
            tests/test_strategy_state_persistence.py

      - name: Run API tests
        run: |
          pytest -q --tb=short \
            tests/test_auth.py \
            tests/test_orders_api.py \
            tests/test_strategies_api.py

      - name: Run WebSocket tests
        run: |
          pytest -q --tb=short \
            tests/test_ws_endpoints.py \
            tests/test_ws_manager.py \
            tests/test_ws_proxies.py

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t crypto-quant-app:latest ./backend
