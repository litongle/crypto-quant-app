name: Build & Push Backend Image

# 触发: 推到 main / 打 vX.Y.Z tag / 手动
# 不在 PR 上跑 — PR 没权限读 secrets,也不需要 push 镜像
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag 策略:
      #   main 推送:  latest + main-<sha>     (用 latest 让 1Panel 默认拉到最新)
      #   v1.2.3 tag: 1.2.3 + 1.2 + 1 + latest (语义版本派生短 tag,固定版本可回滚)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tongle6/crypto-quant-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # 用 buildx + GHA cache 加速重复 build (依赖层、apt 缓存命中);
      # INSTALL_DEV=false 不装 pytest/ruff/black,镜像瘦
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: INSTALL_DEV=false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
