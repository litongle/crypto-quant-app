services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      # Dev: mount source code for hot reload (venv at /opt/venv is NOT overridden)
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # HTTP_PROXY / HTTPS_PROXY / NO_PROXY 全部由 backend/.env 控制（国内开发可配代理，
      # 境外/VPS 留空）。不在这里通过 ${HTTP_PROXY:-} 继承宿主 env，避免覆盖 env_file。
    # 让容器内可通过 host.docker.internal 访问宿主机代理（Linux 必须）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # --proxy-headers: 信任 X-Forwarded-For/Proto,让 request.client.host 反映真实
    #   客户端 IP (而非 Caddy/Docker NAT 的 127.0.0.1) — 否则 rate limit 全 bucket。
    # --forwarded-allow-ips '*': 8000 端口只绑 127.0.0.1,公网无法直连,
    #   能到达这里的只有同机 Caddy / 本地 dev,trust 全部安全;
    #   不写就是默认 127.0.0.1,但 docker NAT 后源 IP 是 bridge gateway,不命中。
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev-postgres-password}
      - POSTGRES_DB=crypto_quant
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: sh -c 'redis-server --appendonly yes --save 60 1000 --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_data:
